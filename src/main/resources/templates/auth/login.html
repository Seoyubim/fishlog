<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: headSection('로그인')}"></head>
<body class="min-h-screen flex items-center justify-center p-4"
      style="background: linear-gradient(145deg, #0d4f4a 0%, #115e59 40%, #0c4a6e 100%);">

<div class="w-full max-w-sm page-enter">

    <!-- 로고 -->
    <div class="text-center mb-8">
        <div class="text-8xl mb-3 drop-shadow-lg">🎣</div>
        <h1 class="text-4xl font-black text-white tracking-tight">FishLog</h1>
        <p class="text-teal-200 mt-2 text-base font-medium">나의 낚시 이야기를 기록하다</p>
    </div>

    <!-- 카드 -->
    <div class="bg-white rounded-3xl shadow-2xl p-7">
        <h2 class="text-2xl font-black text-gray-900 mb-6">로그인</h2>

        <form id="loginForm" class="space-y-4">

            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">아이디</label>
                <input id="username" type="text" placeholder="사용자명을 입력하세요" autocomplete="username"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">비밀번호</label>
                <input id="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMsg"
                 class="hidden py-3 px-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-base font-medium">
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit" id="loginBtn"
                    class="w-full py-4 bg-ocean-700 hover:bg-ocean-800 active:bg-ocean-900
                           text-white text-xl font-black rounded-2xl transition-colors
                           flex items-center justify-center gap-2 shadow-lg shadow-teal-800/20">
                <span id="btnText">🎣 로그인</span>
                <span id="btnSpinner" class="hidden">⏳ 로그인 중...</span>
            </button>
        </form>

        <!-- 회원가입 링크 -->
        <div class="mt-6 pt-6 border-t border-gray-100 text-center">
            <span class="text-gray-500 text-base">아직 회원이 아니신가요?</span>
            <a href="/signup"
               class="ml-2 text-ocean-700 font-black text-base hover:underline">회원가입 →</a>
        </div>
    </div>

    <p class="text-center text-teal-300/70 text-sm mt-6">
        © 2025 FishLog. 낚시의 모든 순간을 기록하세요.
    </p>
</div>

<script>
    // 이미 로그인된 경우 목록으로
    if (Auth.isLoggedIn()) window.location.href = '/logs';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btnText    = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const loginBtn   = document.getElementById('loginBtn');

        if (!username || !password) {
            showError('아이디와 비밀번호를 모두 입력해 주세요.');
            return;
        }

        // 로딩 상태
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
        loginBtn.disabled = true;
        errorMsg.classList.add('hidden');

        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.message || '아이디 또는 비밀번호가 올바르지 않습니다.');
                return;
            }

            Auth.save(data.accessToken, data.userId, data.username);
            window.location.href = '/logs';

        } catch (err) {
            showError('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
        } finally {
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            loginBtn.disabled = false;
        }
    });

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = '⚠️ ' + msg;
        el.classList.remove('hidden');
    }

    // 엔터키 지원
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
    });
</script>
</body>
</html>
