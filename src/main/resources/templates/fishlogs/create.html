<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: headSection('새 낚시 기록')}"></head>
<body class="bg-gray-50 min-h-screen">

<!-- ── 헤더 ─────────────────────────────────────────── -->
<header class="fixed top-0 left-0 right-0 z-40"
        style="background: linear-gradient(135deg, #115e59 0%, #0c4a6e 100%);">
    <div class="max-w-lg mx-auto px-4 h-16 flex items-center gap-3">
        <a href="/logs" class="text-white text-2xl font-bold leading-none">‹</a>
        <h1 class="text-xl font-black text-white">새 낚시 기록</h1>
    </div>
</header>

<!-- ── 컨텐츠 ─────────────────────────────────────────── -->
<main class="max-w-lg mx-auto px-4 pt-20 pb-28">

    <!-- ── 사진 업로드 영역 ────────── -->
    <section class="mb-6">
        <h2 class="text-lg font-black text-gray-800 mb-3">📸 사진 올리고 어종 확인하기</h2>

        <!-- 업로드 트리거 (파일 선택 전) -->
        <label id="uploadTrigger"
               class="flex flex-col items-center justify-center w-full h-44 rounded-2xl
                      border-[3px] border-dashed border-ocean-300 bg-ocean-50
                      cursor-pointer active:bg-ocean-100 transition-colors">
            <span class="text-5xl mb-2">📷</span>
            <span class="text-ocean-800 font-black text-lg">사진 선택하기</span>
            <span class="text-ocean-600 text-sm mt-1">JPEG · PNG · WEBP 지원 (최대 10MB)</span>
            <input id="photoInput" type="file" accept="image/*" class="hidden">
        </label>

        <!-- 미리보기 + AI 결과 (파일 선택 후) -->
        <div id="photoPreviewSection" class="hidden">

            <!-- 썸네일 -->
            <div class="relative rounded-2xl overflow-hidden shadow-md h-56">
                <img id="photoPreview" src="" alt="선택된 사진"
                     class="w-full h-full object-cover">
                <button id="changePhotoBtn"
                        class="absolute top-3 right-3 bg-black/50 text-white text-sm font-bold
                               px-3 py-1.5 rounded-xl backdrop-blur-sm">
                    🔄 다시 선택
                </button>
            </div>

            <!-- AI 분석 대기 -->
            <div id="aiPending"
                 class="mt-3 p-4 bg-blue-50 border border-blue-200 rounded-2xl
                        flex items-center gap-3">
                <span class="text-2xl">🔬</span>
                <div>
                    <p class="font-bold text-blue-800">기록을 저장하면 AI가 어종을 자동 분석합니다</p>
                    <p class="text-blue-600 text-sm mt-0.5">Gemini Vision AI 분석 · 보통 5초 이내</p>
                </div>
            </div>

            <!-- AI 분석 진행 중 -->
            <div id="aiAnalyzing" class="hidden mt-3 p-4 bg-amber-50 border border-amber-200 rounded-2xl">
                <div class="flex items-center gap-3">
                    <span class="text-2xl animate-spin">⚙️</span>
                    <div>
                        <p class="font-bold text-amber-800">AI가 어종을 분석하고 있습니다...</p>
                        <p class="text-amber-600 text-sm mt-0.5">잠시만 기다려 주세요</p>
                    </div>
                </div>
            </div>

            <!-- AI 분석 완료 -->
            <div id="aiResult" class="hidden mt-3 p-4 bg-teal-50 border-2 border-ocean-400 rounded-2xl">
                <div class="flex items-start gap-3">
                    <span class="text-3xl">🤖</span>
                    <div class="flex-1">
                        <p class="text-sm font-bold text-ocean-600 mb-1">AI 어종 자동 분석 완료!</p>
                        <p id="aiFishName"
                           class="text-2xl font-black text-ocean-900"></p>
                        <div class="mt-2 flex items-center gap-2">
                            <div class="flex-1 bg-gray-200 rounded-full h-2.5">
                                <div id="aiConfidenceBar"
                                     class="bg-ocean-600 h-2.5 rounded-full transition-all duration-1000" style="width:0%"></div>
                            </div>
                            <span id="aiConfidenceText"
                                  class="text-sm font-bold text-ocean-700 whitespace-nowrap"></span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">* 정확하지 않을 수 있습니다. 아래에서 직접 수정하세요.</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ── 기록 폼 ─────────────────── -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
        <h2 class="text-lg font-black text-gray-800 mb-4">🎣 낚시 기록 상세 정보</h2>

        <form id="createForm" class="space-y-5">

            <!-- 제목 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">
                    기록 제목 <span class="text-red-500">*</span>
                </label>
                <input id="title" type="text" placeholder="예: 한강에서 잡은 첫 메기!"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <!-- 어종 입력 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">어종 이름</label>
                <input id="fishName" type="text" placeholder="예: 메기 (AI 분석 전 직접 입력)"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
                <p id="fishNameAiHint" class="hidden text-sm text-ocean-600 font-medium mt-1.5">
                    💡 AI 분석 결과가 자동으로 입력되었습니다. 수정하셔도 됩니다.
                </p>
            </div>

            <!-- 날짜 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">
                    낚시 날짜 <span class="text-red-500">*</span>
                </label>
                <input id="catchDate" type="date"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <!-- 위치 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">낚시 장소</label>
                <input id="location" type="text" placeholder="예: 서울 한강 난지공원"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <!-- 수계 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">수계</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="water-btn flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer
                                  has-[:checked]:border-ocean-600 has-[:checked]:bg-ocean-50">
                        <input type="radio" name="waterType" value="FRESHWATER" class="sr-only">
                        <span class="text-2xl">🏞️</span>
                        <span class="font-bold text-lg text-gray-700">민물</span>
                    </label>
                    <label class="water-btn flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer
                                  has-[:checked]:border-ocean-600 has-[:checked]:bg-ocean-50">
                        <input type="radio" name="waterType" value="SEA" class="sr-only">
                        <span class="text-2xl">🌊</span>
                        <span class="font-bold text-lg text-gray-700">바다</span>
                    </label>
                </div>
            </div>

            <!-- 크기/무게 -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-base font-bold text-gray-700 mb-2">어체장 (cm)</label>
                    <input id="lengthCm" type="number" step="0.1" placeholder="예: 42.5"
                           class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                                  focus:border-ocean-600 focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-base font-bold text-gray-700 mb-2">무게 (g)</label>
                    <input id="weightG" type="number" step="1" placeholder="예: 1200"
                           class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                                  focus:border-ocean-600 focus:outline-none transition-colors">
                </div>
            </div>

            <!-- 미끼 & 날씨 -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-base font-bold text-gray-700 mb-2">사용 미끼</label>
                    <input id="bait" type="text" placeholder="예: 지렁이"
                           class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                                  focus:border-ocean-600 focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-base font-bold text-gray-700 mb-2">날씨</label>
                    <select id="weather"
                            class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                                   focus:border-ocean-600 focus:outline-none bg-white">
                        <option value="">선택</option>
                        <option value="SUNNY">☀️ 맑음</option>
                        <option value="CLOUDY">☁️ 흐림</option>
                        <option value="RAINY">🌧️ 비</option>
                        <option value="WINDY">💨 바람</option>
                    </select>
                </div>
            </div>

            <!-- 기온 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">기온 (℃)</label>
                <input id="temperature" type="number" step="0.1" placeholder="예: 24.0"
                       class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg
                              focus:border-ocean-600 focus:outline-none transition-colors">
            </div>

            <!-- 메모 -->
            <div>
                <label class="block text-base font-bold text-gray-700 mb-2">메모</label>
                <textarea id="memo" rows="3" placeholder="낚시하면서 느낀 점, 팁 등을 자유롭게 써주세요."
                          class="w-full py-4 px-4 rounded-xl border-2 border-gray-200 text-lg resize-none
                                 focus:border-ocean-600 focus:outline-none transition-colors"></textarea>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMsg"
                 class="hidden py-3 px-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-base font-medium">
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" id="submitBtn"
                    class="w-full py-4 bg-ocean-700 hover:bg-ocean-800 active:bg-ocean-900
                           text-white text-xl font-black rounded-2xl transition-colors
                           flex items-center justify-center gap-2 shadow-lg shadow-teal-800/20">
                <span id="submitBtnText">🎣 기록 저장하기</span>
                <span id="submitBtnSpinner" class="hidden">⏳ 저장 중...</span>
            </button>

        </form>
    </section>

    <!-- ── 저장 완료 결과 카드 ─────────────────── -->
    <div id="successCard" class="hidden mt-6 page-enter">
        <div class="bg-white rounded-2xl shadow-md border-2 border-ocean-400 p-6">
            <div class="text-center mb-4">
                <span class="text-5xl">🎉</span>
                <h3 class="text-2xl font-black text-gray-900 mt-2">기록 저장 완료!</h3>
            </div>

            <!-- AI 결과 요약 (업로드 시) -->
            <div id="successAiSection" class="hidden mb-4 p-4 bg-teal-50 rounded-xl border border-ocean-200">
                <p class="text-sm font-bold text-ocean-600 mb-1">🤖 AI 어종 분석 결과</p>
                <p id="successFishName" class="text-2xl font-black text-ocean-900"></p>
                <p id="successConfidence" class="text-sm text-ocean-700 font-medium mt-1"></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="resetForm()"
                        class="py-4 border-2 border-gray-300 text-gray-600 font-black rounded-xl text-base">
                    ➕ 다시 기록
                </button>
                <button id="goDetailBtn"
                        class="py-4 bg-ocean-700 text-white font-black rounded-xl text-base">
                    📋 기록 보기
                </button>
            </div>
        </div>
    </div>

</main>

<th:block th:replace="~{fragments/layout :: bottomNav}"></th:block>

<script>
    // 오늘 날짜를 기본값으로
    document.getElementById('catchDate').valueAsDate = new Date();

    let selectedFile = null;
    let createdLogId = null;

    /* ── 사진 선택 ────────────── */
    document.getElementById('photoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedFile = file;

        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('photoPreview').src = ev.target.result;
        };
        reader.readAsDataURL(file);

        document.getElementById('uploadTrigger').classList.add('hidden');
        document.getElementById('photoPreviewSection').classList.remove('hidden');
    });

    document.getElementById('changePhotoBtn').addEventListener('click', () => {
        selectedFile = null;
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreview').src = '';
        document.getElementById('uploadTrigger').classList.remove('hidden');
        document.getElementById('photoPreviewSection').classList.add('hidden');
    });

    /* ── 폼 제출 ─────────────────── */
    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!requireAuth()) return;

        const title     = document.getElementById('title').value.trim();
        const catchDate = document.getElementById('catchDate').value;

        if (!title)     { showError('기록 제목은 필수입니다.'); return; }
        if (!catchDate) { showError('낚시 날짜는 필수입니다.'); return; }

        const waterTypeEl = document.querySelector('input[name="waterType"]:checked');

        const body = {
            title,
            fishName:    document.getElementById('fishName').value.trim() || null,
            catchDate,
            location:    document.getElementById('location').value.trim()  || null,
            waterType:   waterTypeEl ? waterTypeEl.value : null,
            lengthCm:    parseFloatOrNull('lengthCm'),
            weightG:     parseFloatOrNull('weightG'),
            bait:        document.getElementById('bait').value.trim()     || null,
            weather:     document.getElementById('weather').value         || null,
            temperature: parseFloatOrNull('temperature'),
            memo:        document.getElementById('memo').value.trim()     || null,
        };

        setLoading(true);

        try {
            /* 1. 낚시 기록 생성 */
            const createRes = await apiFetch('/fish-logs', {
                method: 'POST',
                body: JSON.stringify(body)
            });
            if (!createRes) return;

            if (!createRes.ok) {
                const err = await createRes.json();
                showError(err.message || '기록 저장에 실패했습니다.');
                return;
            }

            const logData = await createRes.json();
            createdLogId = logData.id;

            /* 2. 사진이 있으면 업로드 + AI 분석 */
            if (selectedFile) {
                document.getElementById('aiPending').classList.add('hidden');
                document.getElementById('aiAnalyzing').classList.remove('hidden');

                const formData = new FormData();
                formData.append('file', selectedFile);

                const photoRes = await apiFetch(`/fish-logs/${createdLogId}/photos`, {
                    method: 'POST',
                    body: formData
                });

                document.getElementById('aiAnalyzing').classList.add('hidden');

                if (photoRes && photoRes.ok) {
                    const photoData = await photoRes.json();
                    if (photoData.aiClassified) {
                        showAiResult(photoData);
                    }
                }

                showSuccessWithAi(logData, createdLogId);
            } else {
                showSuccess(createdLogId);
            }

        } catch (err) {
            showError('오류가 발생했습니다: ' + err.message);
        } finally {
            setLoading(false);
        }
    });

    /* ── AI 결과 인라인 표시 ─────── */
    function showAiResult(photoData) {
        const resultEl = document.getElementById('aiResult');
        const fishNameEl = document.getElementById('aiFishName');
        const barEl = document.getElementById('aiConfidenceBar');
        const confTextEl = document.getElementById('aiConfidenceText');

        // fishLog의 fishNameAi가 photoData에 없을 수 있으므로 어종명은 별도 fetch 필요 없이
        // 사진 응답에서 가져오거나 페이지 완료 후 보여줌
        const confidence = photoData.aiConfidence
            ? Math.round(photoData.aiConfidence * 100)
            : null;

        fishNameEl.textContent = '분석 완료 ✓';
        if (confidence !== null) {
            confTextEl.textContent = `신뢰도 ${confidence}%`;
            setTimeout(() => { barEl.style.width = confidence + '%'; }, 100);
        }

        resultEl.classList.remove('hidden');

        // AI 분류 후 어종명 자동 입력을 위해 상세 조회
        apiFetch(`/fish-logs/${createdLogId}`)
            .then(r => r && r.ok ? r.json() : null)
            .then(data => {
                if (data && data.fishNameAi) {
                    fishNameEl.textContent = data.fishNameAi;
                    // 폼의 어종명 필드에도 자동입력
                    document.getElementById('fishName').value = data.fishNameAi;
                    document.getElementById('fishNameAiHint').classList.remove('hidden');
                }
            });
    }

    function showSuccessWithAi(logData, logId) {
        document.getElementById('createForm').classList.add('hidden');
        const card = document.getElementById('successCard');
        card.classList.remove('hidden');
        card.scrollIntoView({ behavior: 'smooth' });
        document.getElementById('goDetailBtn').onclick = () => location.href = `/logs/${logId}`;

        // AI 결과 가져와서 성공 카드에 표시
        apiFetch(`/fish-logs/${logId}`)
            .then(r => r && r.ok ? r.json() : null)
            .then(data => {
                if (data && data.fishNameAi) {
                    document.getElementById('successFishName').textContent = data.fishNameAi;
                    const conf = data.photos && data.photos[0] && data.photos[0].aiConfidence
                        ? Math.round(data.photos[0].aiConfidence * 100) + '% 확률로 분석됨'
                        : '';
                    document.getElementById('successConfidence').textContent = conf;
                    document.getElementById('successAiSection').classList.remove('hidden');
                }
            });
    }

    function showSuccess(logId) {
        document.getElementById('createForm').classList.add('hidden');
        const card = document.getElementById('successCard');
        card.classList.remove('hidden');
        card.scrollIntoView({ behavior: 'smooth' });
        document.getElementById('goDetailBtn').onclick = () => location.href = `/logs/${logId}`;
    }

    /* ── 유틸 ─────────────────────── */
    function parseFloatOrNull(id) {
        const v = document.getElementById(id).value;
        return v ? parseFloat(v) : null;
    }

    function setLoading(on) {
        document.getElementById('submitBtn').disabled = on;
        document.getElementById('submitBtnText').classList.toggle('hidden', on);
        document.getElementById('submitBtnSpinner').classList.toggle('hidden', !on);
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = '⚠️ ' + msg;
        el.classList.remove('hidden');
        el.scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
        location.reload();
    }
</script>
</body>
</html>
