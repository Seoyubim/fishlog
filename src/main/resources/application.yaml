spring:
  application:
    name: fishlog

  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 운영: validate, 개발: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

storage:
  upload-dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  fishial:
    base-url: ${AI_FISHIAL_BASE_URL:https://api.fishial.ai}
    client-id: ${AI_FISHIAL_CLIENT_ID}
    client-secret: ${AI_FISHIAL_CLIENT_SECRET}
