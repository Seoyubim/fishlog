spring:
  application:
    name: fishlog

  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # 운영: validate, 개발: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

storage:
  upload-dir: ${UPLOAD_DIR:./uploads}

ai:
  fish-classification:
    base-url: ${AI_API_BASE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}
    timeout-seconds: 10